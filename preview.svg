<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/><stop offset="100%" stop-color="#64D2FF"/>
    </linearGradient>
  </defs>

  <rect width="360" height="620" rx="40" fill="#000"/>
  <rect x="0.5" y="0.5" width="359" height="619" rx="39.5" fill="none" stroke="#2C2C2E"/>

  <!-- title -->
  <text x="20" y="62" fill="#fff" font-size="30" font-weight="700" letter-spacing="-.5">Work Hours</text>
  <text x="20" y="82" fill="#8E8E93" font-size="10.5">130 h a month · lunch unpaid · rounded down to 30 min</text>

  <!-- summary -->
  <text x="20" y="112" fill="#8E8E93" font-size="9.5" letter-spacing="1">SUMMARY</text>
  <rect x="16" y="122" width="328" height="182" rx="10" fill="#1C1C1E"/>

  <g transform="translate(84,213)">
    <circle r="44" fill="none" stroke="#2C2C2E" stroke-width="11"/>
    <circle r="44" fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round"
            stroke-dasharray="276.5" stroke-dashoffset="77.4" transform="rotate(-90)"/>
    <text y="2" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">72%</text>
    <text y="17" text-anchor="middle" fill="#8E8E93" font-size="8.5">of target</text>
  </g>

  <g font-size="9.5" fill="#8E8E93">
    <text x="150" y="158">Paid</text>            <text x="252" y="158">Remaining</text>
    <text x="150" y="212">Days worked</text>     <text x="252" y="212">Unpaid extra</text>
    <text x="150" y="266">Lost to rounding</text><text x="252" y="266">Leave days</text>
  </g>
  <g font-size="17" font-weight="600" fill="#fff">
    <text x="150" y="177">93.50<tspan font-size="11" font-weight="400" fill="#8E8E93">h</tspan></text>
    <text x="252" y="177">36.50<tspan font-size="11" font-weight="400" fill="#8E8E93">h</tspan></text>
    <text x="150" y="231">13</text>
    <text x="252" y="231" fill="#FF453A">0.00<tspan font-size="11" font-weight="400" fill="#8E8E93">h</tspan></text>
    <text x="150" y="285" fill="#FF9F0A">3.50<tspan font-size="11" font-weight="400" fill="#8E8E93">h</tspan></text>
    <text x="252" y="285">1</text>
  </g>

  <!-- earnings -->
  <rect x="16" y="316" width="328" height="76" rx="10" fill="#1C1C1E"/>
  <text x="32" y="344" fill="#fff" font-size="13">You get paid</text>
  <text x="328" y="344" fill="#30D158" font-size="13" font-weight="600" text-anchor="end">₹6,545</text>
  <line x1="32" y1="356" x2="344" y2="356" stroke="#2C2C2E"/>
  <text x="32" y="378" fill="#fff" font-size="13">Worked, never paid</text>
  <text x="328" y="378" fill="#FF9F0A" font-size="13" font-weight="600" text-anchor="end">₹245</text>

  <!-- entries -->
  <text x="20" y="422" fill="#8E8E93" font-size="9.5" letter-spacing="1">ENTRIES</text>
  <text x="344" y="422" fill="#0A84FF" font-size="11" text-anchor="end">Edit</text>
  <rect x="16" y="432" width="328" height="164" rx="10" fill="#1C1C1E"/>

  <g>
    <text x="32" y="458" fill="#fff" font-size="14">4 Aug <tspan fill="#8E8E93" font-size="12">Tue</tspan></text>
    <text x="32" y="474" fill="#8E8E93" font-size="10">09:00 – 17:18 · lunch 13:00–13:30</text>
    <text x="322" y="460" fill="#0A84FF" font-size="14" font-weight="600" text-anchor="end">7.50 h</text>
    <text x="322" y="474" fill="#48484A" font-size="9.5" text-anchor="end">7h 48m raw</text>
    <text x="334" y="466" fill="#48484A" font-size="15" text-anchor="end">›</text>
  </g>
  <line x1="32" y1="488" x2="344" y2="488" stroke="#2C2C2E"/>
  <g>
    <text x="32" y="512" fill="#fff" font-size="14">5 Aug <tspan fill="#8E8E93" font-size="12">Wed</tspan></text>
    <rect x="86" y="502" width="38" height="14" rx="4" fill="#3A2A10"/>
    <text x="105" y="512" fill="#FF9F0A" font-size="9.5" text-anchor="middle">Leave</text>
    <text x="32" y="528" fill="#8E8E93" font-size="10">On leave — no hours counted</text>
    <text x="322" y="516" fill="#48484A" font-size="14" font-weight="600" text-anchor="end">—</text>
    <text x="334" y="516" fill="#48484A" font-size="15" text-anchor="end">›</text>
  </g>
  <line x1="32" y1="542" x2="344" y2="542" stroke="#2C2C2E"/>
  <g>
    <text x="32" y="566" fill="#fff" font-size="14">6 Aug <tspan fill="#8E8E93" font-size="12">Thu</tspan></text>
    <text x="32" y="582" fill="#8E8E93" font-size="10">09:00 – 16:48 · lunch 13:00–13:30</text>
    <text x="322" y="568" fill="#0A84FF" font-size="14" font-weight="600" text-anchor="end">7.00 h</text>
    <text x="322" y="582" fill="#48484A" font-size="9.5" text-anchor="end">7h 18m raw</text>
    <text x="334" y="574" fill="#48484A" font-size="15" text-anchor="end">›</text>
  </g>
</svg>
